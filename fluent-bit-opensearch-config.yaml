apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Grace         30
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On
        storage.path  /tmp/storage
        storage.sync  normal
        storage.checksum off
        storage.backlog.mem_limit 5M

    [INPUT]
        Name              tail
        Tag               rasp.*
        Path              /var/log/containers/*rasp*.log,/var/log/containers/*pod-agent*.log
        Parser            docker
        DB                /var/log/flb_rasp.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [INPUT]
        Name              tail
        Tag               kubernetes.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*rasp*.log,/var/log/containers/*pod-agent*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               rasp.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     rasp.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off
        Labels              On

    [FILTER]
        Name                kubernetes
        Match               kubernetes.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kubernetes.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off
        Labels              On

    [FILTER]
        Name          parser
        Match         rasp.*
        Key_Name      log
        Parser        json_parser
        Reserve_Data  On
        Preserve_Key  On

    [FILTER]
        Name          nest
        Match         rasp.*
        Operation     lift
        Nested_under  log
        Add_prefix    event_

    [OUTPUT]
        Name            opensearch
        Match           rasp.*
        Host            opensearch-cluster-master.logging.svc.cluster.local
        Port            9200
        Index           rasp
        tls             Off
        tls.verify      Off
        Suppress_Type_Name On
        Logstash_Format On
        Logstash_Prefix rasp
        Logstash_DateFormat %Y.%m.%d
        Include_Tag_Key On
        Tag_Key         source_tag
        
    [OUTPUT]
        Name            opensearch
        Match           kubernetes.*
        Host            opensearch-cluster-master.logging.svc.cluster.local
        Port            9200
        Index           kubernetes
        tls             Off
        tls.verify      Off
        Suppress_Type_Name On
        Logstash_Format On
        Logstash_Prefix kubernetes
        Logstash_DateFormat %Y.%m.%d
        Include_Tag_Key On
        Tag_Key         source_tag

  parsers.conf: |
    [PARSER]
        Name   docker
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        json_parser
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On 