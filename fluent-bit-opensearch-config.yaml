apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Grace         30
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

    [INPUT]
        Name              tail
        Tag               rasp.*
        Path              /var/log/containers/*rasp*.log,/var/log/containers/*pod-agent*.log
        Parser            docker
        DB                /var/log/flb_rasp.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [INPUT]
        Name              tail
        Tag               kubernetes.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*rasp*.log,/var/log/containers/*pod-agent*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               rasp.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     rasp.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off
        Labels              On

    [FILTER]
        Name                kubernetes
        Match               kubernetes.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kubernetes.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off
        Labels              On

    [FILTER]
        Name          lua
        Match         rasp.*
        script        /fluent-bit/etc/json_parser.lua
        call          parse_json_logs

    [OUTPUT]
        Name            opensearch
        Match           rasp.*
        Host            opensearch.logging.svc.cluster.local
        Port            9200
        Index           rasp
        tls             Off
        tls.verify      Off
        Suppress_Type_Name On
        Logstash_Format On
        Logstash_Prefix rasp
        Logstash_DateFormat %Y.%m.%d
        Include_Tag_Key On
        Tag_Key         source_tag
        Retry_Limit     3
        workers         1
        
    [OUTPUT]
        Name            opensearch
        Match           kubernetes.*
        Host            opensearch.logging.svc.cluster.local
        Port            9200
        Index           kubernetes
        tls             Off
        tls.verify      Off
        Suppress_Type_Name On
        Logstash_Format On
        Logstash_Prefix kubernetes
        Logstash_DateFormat %Y.%m.%d
        Include_Tag_Key On
        Tag_Key         source_tag
        Retry_Limit     3
        workers         1

  parsers.conf: |
    [PARSER]
        Name   docker
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        json_parser
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

  json_parser.lua: |
    function parse_json_logs(tag, timestamp, record)
        local log = record["log"]
        
        if log and type(log) == "string" then
            -- Check if log starts with '{' (JSON)
            if string.sub(log, 1, 1) == "{" then
                local json = require("cjson")
                local success, parsed = pcall(json.decode, log)
                
                if success and type(parsed) == "table" then
                    -- Successfully parsed JSON - merge fields
                    for key, value in pairs(parsed) do
                        record[key] = value
                    end
                    
                    -- Create easily accessible copies of important fields
                    if parsed.severity then
                        record["level_severity"] = parsed.severity
                    end
                    if parsed.event_type then
                        record["rasp_event_type"] = parsed.event_type
                    end
                    if parsed.agent_id then
                        record["rasp_agent_id"] = parsed.agent_id
                    end
                    if parsed.message then
                        record["rasp_message"] = parsed.message
                    end
                    
                    -- Keep original log for reference
                    record["original_log"] = log
                else
                    -- Not valid JSON - keep as plain text
                    record["log_type"] = "plain_text"
                end
            else
                -- Not JSON - keep as plain text
                record["log_type"] = "plain_text"
            end
        end
        
        return 1, timestamp, record
    end 