# Fluent Bit configuration for RASP log collection

# Service configuration
service:
  type: ClusterIP
  port: 2020

# Resource limits
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Tolerations for running on all nodes
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Node selector (optional)
nodeSelector: {}

# Pod Security Context
securityContext:
  fsGroup: 2000
  runAsUser: 1000
  runAsNonRoot: true

# Configuration files
config:
  # Main Fluent Bit configuration
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Grace         30
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On
        HC_Errors_Count 5
        HC_Retry_Failure_Count 5
        HC_Period     60
        storage.path  /tmp/storage
        storage.sync  normal
        storage.checksum off
        storage.backlog.mem_limit 5M

    [INPUT]
        Name              tail
        Alias             kubernetes-rasp-controller
        Tag               rasp.controller.*
        Path              /var/log/containers/*rasp-controller*.log
        Parser            docker
        DB                /tmp/flb_rasp_controller.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        Rotate_Wait       30
        storage.type      memory

    [INPUT]
        Name              tail
        Alias             kubernetes-rasp-agent
        Tag               rasp.agent.*
        Path              /var/log/containers/*pod-agent*.log
        Parser            docker
        DB                /tmp/flb_rasp_agent.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        Rotate_Wait       30
        storage.type      memory

    [INPUT]
        Name              tail
        Alias             kubernetes-containers
        Tag               kube.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*_kube-system_*, /var/log/containers/*_logging_*
        Parser            docker
        DB                /tmp/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        Rotate_Wait       30
        storage.type      memory

    [FILTER]
        Name                kubernetes
        Alias               kubernetes-filter
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Annotations         Off
        Labels              On

    [FILTER]
        Name                kubernetes
        Alias               rasp-controller-filter
        Match               rasp.controller.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     rasp.controller.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Annotations         On
        Labels              On

    [FILTER]
        Name                kubernetes
        Alias               rasp-agent-filter
        Match               rasp.agent.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     rasp.agent.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Annotations         On
        Labels              On

    [FILTER]
        Name                parser
        Alias               rasp-controller-parser
        Match               rasp.controller.*
        Key_Name            log
        Parser              rasp_controller_json
        Reserve_Data        On

    [FILTER]
        Name                parser
        Alias               rasp-agent-parser
        Match               rasp.agent.*
        Key_Name            log
        Parser              rasp_agent_json
        Reserve_Data        On

    [FILTER]
        Name                modify
        Alias               rasp-enrichment
        Match               rasp.*
        Add                 component rasp
        Add                 cluster local
        Add                 environment development

    [OUTPUT]
        Name                es
        Alias               elasticsearch-rasp
        Match               rasp.*
        Host                elasticsearch-master.logging.svc.cluster.local
        Port                9200
        Index               rasp-logs
        Type                _doc
        Logstash_Format     On
        Logstash_Prefix     rasp
        Logstash_DateFormat %Y.%m.%d
        Include_Tag_Key     On
        Tag_Key             @tag
        Time_Key            @timestamp
        Time_Key_Format     %Y-%m-%dT%H:%M:%S.%L%z
        Retry_Limit         5
        Replace_Dots        On
        Trace_Error         On
        storage.total_limit_size 512M

    [OUTPUT]
        Name                es
        Alias               elasticsearch-kube
        Match               kube.*
        Host                elasticsearch-master.logging.svc.cluster.local
        Port                9200
        Index               kubernetes-logs
        Type                _doc
        Logstash_Format     On
        Logstash_Prefix     kubernetes
        Logstash_DateFormat %Y.%m.%d
        Include_Tag_Key     On
        Tag_Key             @tag
        Time_Key            @timestamp
        Time_Key_Format     %Y-%m-%dT%H:%M:%S.%L%z
        Retry_Limit         5
        Replace_Dots        On
        Trace_Error         On
        storage.total_limit_size 512M

  # Custom parsers for RASP logs
  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        rasp_controller_json
        Format      regex
        Regex       ^(?<time>[^\s]+)\s+(?<level>[^\s]+)\s+(?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    [PARSER]
        Name        rasp_agent_json
        Format      regex
        Regex       ^(?<time>[^\s]+)\s+(?<level>[^\s]+)\s+\[(?<component>[^\]]+)\]\s+(?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    [PARSER]
        Name        rasp_event_json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        syslog
        Format      regex
        Regex       ^\<(?<pri>[0-9]+)\>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
        Time_Key    time
        Time_Format %b %d %H:%M:%S

# Volumes and mounts
volumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

# DaemonSet configuration
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

# Metrics
metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 2020

# Environment variables
env:
  - name: FLUENT_ELASTICSEARCH_HOST
    value: "elasticsearch-master.logging.svc.cluster.local"
  - name: FLUENT_ELASTICSEARCH_PORT
    value: "9200" 