syntax = "proto3";

package telemetry;

option go_package = "github.com/danushkastanley/rasp-controller/pkg/api/proto";

// Import timestamp support
import "google/protobuf/timestamp.proto";

// Event types that can be monitored
enum EventType {
  UNKNOWN = 0;
  EXEC = 1;
  OPEN = 2;
  CONNECT = 3;
  FORK = 4;
  PTRACE = 5;
  SETUID = 6;
  SETGID = 7;
  MOUNT = 8;
  UMOUNT = 9;
  CAPSET = 10;
  BPF_PROG = 11;
  SECCOMP = 12;
  SOCKET = 13;
  BIND = 14;
  ACCEPT = 15;
}

// Network information for connection-related events
message NetworkInfo {
  string source_ip = 1;
  string destination_ip = 2;
  uint32 port = 3;
  string protocol = 4; // TCP, UDP, etc.
}

// File system related information
message FileInfo {
  string path = 1;
  uint32 flags = 2;
  uint32 mode = 3;
}

// Process information
message ProcessInfo {
  uint32 pid = 1;
  uint32 ppid = 2;
  uint32 uid = 3;
  uint32 gid = 4;
  string command = 5;
  repeated string args = 6;
  repeated string capabilities = 7;
}

// Container context
message ContainerInfo {
  string container_id = 1;
  string pod_name = 2;
  string namespace = 3;
  string image = 4;
}

// Main security event message
message SecurityEvent {
  // Event metadata
  string event_id = 1;
  EventType event_type = 2;
  google.protobuf.Timestamp timestamp = 3;
  
  // Context information
  ProcessInfo process = 4;
  ContainerInfo container = 5;
  
  // Optional event-specific details
  oneof event_details {
    NetworkInfo network_info = 6;
    FileInfo file_info = 7;
  }
  
  // Additional metadata
  map<string, string> labels = 8;
  string raw_data = 9;
}

// Filter configuration for events
message EventFilter {
  repeated EventType included_types = 1;
  repeated string command_patterns = 2;
  repeated uint32 uid_list = 3;
  bool capture_all = 4;
}

// Configuration update
message ConfigUpdate {
  EventFilter filter = 1;
  bool debug_mode = 2;
}

// Telemetry service definition
service TelemetryService {
  // Stream security events to the controller
  rpc StreamEvents(stream SecurityEvent) returns (stream ConfigUpdate);
  
  // Send a batch of events (for efficiency in some cases)
  rpc SendEventBatch(SecurityEventBatch) returns (BatchResponse);
}

// Batch-related messages
message SecurityEventBatch {
  repeated SecurityEvent events = 1;
  string agent_id = 2;
}

message BatchResponse {
  bool success = 1;
  string message = 2;
}
