apiVersion: v1
kind: Service
metadata:
  name: rasp-controller
  labels:
    app: rasp-controller
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
  selector:
    app: rasp-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rasp-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rasp-controller
  template:
    metadata:
      labels:
        app: rasp-controller
    spec:
      containers:
        - name: controller
          image: rasp-controller:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=:50051"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=:50051"]
            initialDelaySeconds: 5
            periodSeconds: 10
