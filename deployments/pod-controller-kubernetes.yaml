apiVersion: v1
kind: Service
metadata:
  name: rasp-controller
  labels:
    app: rasp-controller
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
  selector:
    app: rasp-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rasp-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rasp-controller
  template:
    metadata:
      labels:
        app: rasp-controller
    spec:
      containers:
        - name: controller
          image: rasp-controller:latest
          imagePullPolicy: Never
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_LEVEL
              value: "info"
          ports:
            - containerPort: 50051
              name: grpc
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=:50051
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=:50051
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/grpc-health-probe
                - -addr=:50051
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
