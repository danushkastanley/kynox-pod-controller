apiVersion: v1
kind: ConfigMap
metadata:
  name: rasp-controller-config
data:
  .env: |
    # Controller Configuration
    PORT=50051
    NODE_NAME=${NODE_NAME}
    POD_NAME=${POD_NAME}
    LOG_LEVEL=info
    DEBUG=info  # Set to 'debug' for verbose logging

    # Alert Configuration
    # Slack Integration
    SLACK_WEBHOOK_URL=https://hooks.slack.com/services/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
    SLACK_CHANNEL=#alert

    # Generic Webhook Integration
    ALERT_WEBHOOK_URL=

    # Alert Filtering
    ALERT_EVENT_TYPES=exec,setuid,mount
    ALERT_MIN_LEVEL=warning
    ALERT_RATE_LIMIT=10
