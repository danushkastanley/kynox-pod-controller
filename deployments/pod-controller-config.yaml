apiVersion: v1
kind: ConfigMap
metadata:
  name: rasp-controller-config
data:
  .env: |
    # Controller Configuration
    PORT=50051
    NODE_NAME=
    POD_NAME=
    LOG_LEVEL=info

    # Alert Configuration
    # Slack Integration
    SLACK_WEBHOOK_URL=https://hooks.slack.com/services/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
    SLACK_CHANNEL=#alert

    # Generic Webhook Integration
    ALERT_WEBHOOK_URL=

    # Alert Filtering
    ALERT_EVENT_TYPES=
    ALERT_MIN_LEVEL=WARNING
    ALERT_RATE_LIMIT=10
